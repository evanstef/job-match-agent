# VPS: docker compose -f docker-compose.prod.yml pull && up -d
# butuh .env (secret) di folder yang sama

services:
  db:
    image: pgvector/pgvector:pg17
    container_name: jobmatch-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # tanpa ports → DB cuma diakses api lewat jaringan internal

  api:
    image: ${API_IMAGE:?set API_IMAGE, mis. export API_IMAGE=<user>/job-match-api:latest}
    container_name: jobmatch-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      # di dalam compose, DB ada di host "db" port 5432 — bukan localhost:5433
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # scraper ada di jaringan internal compose, bukan localhost
      SCRAPER_URL: http://scraper:3000
      # bot WA ada di jaringan internal compose
      WHATSAPP_URL: http://wa-bot:3900
    volumes:
      - model_cache:/app/.model-cache
    ports:
      - "8010:8010"   # publik sementara (belum ada domain); ganti Caddy+HTTPS nanti
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8010/health').status==200 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  web:
    image: ${WEB_IMAGE:?set WEB_IMAGE, mis. export WEB_IMAGE=<user>/job-match-web:latest}
    container_name: jobmatch-web
    restart: unless-stopped
    ports:
      - "3010:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
      
  scraper-db:
    image: postgres:17-alpine
    container_name: scraper-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: scaper
      # password sendiri, TIDAK berbagi dengan jobmatch-db yang menyimpan CV & akun
      POSTGRES_PASSWORD: ${SCRAPER_DB_PASSWORD:?set SCRAPER_DB_PASSWORD di .env}
      POSTGRES_DB: scaper
    volumes:
      - scraper_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scaper -d scaper"]
      interval: 10s
      timeout: 5s
      retries: 5

  scraper:
    image: ${SCRAPER_IMAGE:?set SCRAPER_IMAGE, mis. export SCRAPER_IMAGE=<user>/job-match-scraper:latest}
    container_name: jobmatch-scraper
    restart: unless-stopped
    depends_on:
      scraper-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://scaper:${SCRAPER_DB_PASSWORD}@scraper-db:5432/scaper
      PORT: "3000"
      API_KEY: ${SCRAPER_API_KEY}
      CRON_ENABLED: "true"
      CRON_SCHEDULE: "0 21 * * *"
      # 6 itu warisan era Glints (tiap deskripsi = buka halaman pakai browser).
      # Semua sumber sekarang JSON API, jadi jauh lebih murah.
      ENRICH_PER_RUN: "${ENRICH_PER_RUN:-14}"
      ENRICH_CRON_SCHEDULE: "0 22-23,0-7 * * *"
      MAX_UMUR_HARI: "7"
      # proxy residential (opsional) — isi di .env kalau IP VPS diblokir Cloudflare
      PROXY_SERVER: ${PROXY_SERVER:-}
      PROXY_USERNAME: ${PROXY_USERNAME:-}
      PROXY_PASSWORD: ${PROXY_PASSWORD:-}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/v1/jobs',r=>process.exit(r.statusCode?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    # jaringan internal saja, tidak diekspos publik

  wa-bot:
    image: ${WA_BOT_IMAGE:?set WA_BOT_IMAGE, mis. export WA_BOT_IMAGE=<user>/personal-bot-whatsapp:latest}
    container_name: jobmatch-wa-bot
    restart: unless-stopped
    environment:
      PORT: "3900"
      API_KEY: ${WHATSAPP_API_KEY}
    volumes:
      # ⚠️ sesi WhatsApp. Tanpa volume ini tiap deploy = scan QR ulang.
      - wa_auth:/app/.baileys_auth
    healthcheck:
      # cuma memastikan layanannya hidup — "healthy" BUKAN berarti sudah tertaut
      test: ["CMD", "node", "-e", "fetch('http://localhost:3900/status').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    # tanpa ports → cuma bisa dihubungi api lewat jaringan internal

volumes:
  pgdata:
  model_cache:
  scraper_pgdata:
  wa_auth:
