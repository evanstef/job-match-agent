name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# least-privilege: token workflow read-only (cukup buat checkout)
permissions:
  contents: read

jobs:
  # lint dan init test
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check src tests
      - name: Test
        env:
          DATABASE_URL: postgresql+psycopg://t:t@localhost:5432/t
          JWT_SECRET: test
        run: uv run pytest

  build-push:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build & push API
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/job-match-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/job-match-api:sha-${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build & push web
        uses: docker/build-push-action@v6
        with:
          context: apps/web
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/job-match-web:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/job-match-web:sha-${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    needs: build-push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Kirim compose ke VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: docker-compose.prod.yml
          target: ~/job-match/
      - name: Pull image + up
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/job-match
            export API_IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/job-match-api:sha-${{ github.sha }}
            export WEB_IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/job-match-web:sha-${{ github.sha }}
            export SCRAPER_IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/job-match-scraper:latest
            export WA_BOT_IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/personal-bot-whatsapp:latest
            # cuma urus service milik repo ini; scraper diurus repo job-scraper-api
            docker compose --env-file .env -f docker-compose.prod.yml pull api web
            docker compose --env-file .env -f docker-compose.prod.yml up -d db api web
            # -a: buang image bertag yang tak dipakai container, bukan cuma yang dangling.
            # Tanpa -a, tiap deploy menumpuk image lama selamanya (prune-nya nol sasaran).
            # Versi lama tetap ada di Docker Hub, jadi rollback masih bisa lewat pull.
            docker image prune -af
