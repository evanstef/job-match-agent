name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# least-privilege: token workflow read-only (cukup buat checkout)
permissions:
  contents: read

jobs:
  # lint dan init test
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check src tests
      - name: Test
        env:
          DATABASE_URL: postgresql+psycopg://t:t@localhost:5432/t
          JWT_SECRET: test
        run: uv run pytest

  # gerbang kualitas penilai: lawan golden set, gagal = deploy diblokir.
  # Cuma saat push (PR tak bisa memblokir merge — master tak diproteksi) dan cuma
  # kalau otak berubah, karena satu run makan ~52rb token kuota Groq eval.
  eval:
    # DIMATIKAN 2026-09-23: ~8 menit per deploy. Nyalakan lagi: hapus `false &&`
    # di sini DAN kembalikan `eval` ke needs build-push.
    if: false && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Cek otak penilai berubah
        id: cek
        # diff gagal (mis. push pertama) = anggap berubah, lebih baik eval daripada lolos buta
        run: |
          if git diff --quiet ${{ github.event.before }} ${{ github.sha }} -- \
              src/job_match_api/brain src/job_match_api/pipeline.py \
              src/job_match_api/config.py ops/eval_penilai.py 2>/dev/null; then
            echo "otak=false" >> "$GITHUB_OUTPUT"
          else
            echo "otak=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.cek.outputs.otak == 'true'
        uses: astral-sh/setup-uv@v5
      - if: steps.cek.outputs.otak == 'true'
        run: uv sync --frozen
      - if: steps.cek.outputs.otak == 'true'
        uses: actions/cache@v4
        with:
          path: apps/api/.model-cache
          key: fastembed-${{ hashFiles('apps/api/src/job_match_api/vektor.py') }}
      - name: Tulis data eval dari secret
        if: steps.cek.outputs.otak == 'true'
        env:
          GOLDEN: ${{ secrets.EVAL_GOLDEN_SET }}
          SYARAT: ${{ secrets.EVAL_GOLDEN_SYARAT }}
          CV: ${{ secrets.EVAL_CV_JSON }}
        run: |
          printf '%s' "$GOLDEN" > "$RUNNER_TEMP/golden.json"
          printf '%s' "$SYARAT" > "$RUNNER_TEMP/syarat.json"
          printf '%s' "$CV" > "$RUNNER_TEMP/cv.json"
      - name: Eval penilai
        if: steps.cek.outputs.otak == 'true'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY_EVAL }}
          DATABASE_URL: postgresql+psycopg://t:t@localhost:5432/t
          JWT_SECRET: test
        # exit 1 = kualitas turun, exit 2 = ada lowongan gagal dinilai (429) -> re-run job
        run: >-
          uv run python ops/eval_penilai.py --ulangan 1
          --hanya 7856,7857,7858,7859,7860,7861,7862,7863,7864,7884,7885,7891,7869
          --golden "$RUNNER_TEMP/golden.json" --syarat "$RUNNER_TEMP/syarat.json"
          --cv-json "$RUNNER_TEMP/cv.json"
          --min-vonis 7 --min-korelasi 0.35 --wajib-kirim

  build-push:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build & push API
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/job-match-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/job-match-api:sha-${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build & push web
        uses: docker/build-push-action@v6
        with:
          context: apps/web
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/job-match-web:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/job-match-web:sha-${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    needs: build-push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Kirim compose ke VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: docker-compose.prod.yml
          target: ~/job-match/
      - name: Pull image + up
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/job-match
            export API_IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/job-match-api:sha-${{ github.sha }}
            export WEB_IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/job-match-web:sha-${{ github.sha }}
            export SCRAPER_IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/job-match-scraper:latest
            export WA_BOT_IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/personal-bot-whatsapp:latest
            # cuma urus service milik repo ini; scraper diurus repo job-scraper-api
            docker compose --env-file .env -f docker-compose.prod.yml pull api web
            docker compose --env-file .env -f docker-compose.prod.yml up -d db api web caddy
            docker image prune -af || true
